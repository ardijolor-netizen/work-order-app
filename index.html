<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Work Order</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwVEah7FyHgjy4wjcmPaEinWTtB1qiDZOavdZah8JFmXMvnHww4MTTXYuO1MEocmCGlSg/exec";

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        renderTables(data);
      } catch (err) {
        console.log("Gagal memuat data:", err);
      }
    }

    // Fungsi submit menggunakan form tersembunyi (100% tembus tanpa error CORS)
    function submitOrder(e) {
      e.preventDefault();
      
      const nama = document.getElementById("nama").value;
      const lokasi = document.getElementById("lokasi").value;
      const deskripsi = document.getElementById("deskripsi").value;

      // Buat URL tujuan dengan parameter lengkap
      const targetUrl = `${API_URL}?action=create&nama=${encodeURIComponent(nama)}&lokasi=${encodeURIComponent(lokasi)}&deskripsi=${encodeURIComponent(deskripsi)}`;

      // Kirim lewat hidden iframe agar tidak diblokir browser
      let iframe = document.getElementById("hidden_iframe");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "hidden_iframe";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }
      
      iframe.src = targetUrl;

      alert("Work Order Berhasil Dikirim!");
      document.getElementById("formOrder").reset();
      
      // Tunggu 2 detik lalu muat ulang tabel otomatis
      setTimeout(loadData, 2000);
    }

    async function updateOrder(id, teknisi, status, catatan) {
      const targetUrl = `${API_URL}?action=update&id=${encodeURIComponent(id)}&teknisi=${encodeURIComponent(teknisi)}&status=${encodeURIComponent(status)}&catatan=${encodeURIComponent(catatan)}`;

      let iframe = document.getElementById("hidden_iframe");
      if (!iframe) {
        iframe = document.createElement("iframe");
        iframe.id = "hidden_iframe";
        iframe.style.display = "none";
        document.body.appendChild(iframe);
      }
      
      iframe.src = targetUrl;
      alert("Perintah Update Dikirim!");
      setTimeout(loadData, 2000);
    }

    function renderTables(data) {
      const container = document.getElementById("dataWO");
      container.innerHTML = "";
      if (!Array.isArray(data)) return;
      
      data.forEach(item => {
        container.innerHTML += `
          <tr class="border-b">
            <td class="p-2 font-bold">${item.ID}</td>
            <td class="p-2">${item.Tanggal}</td>
            <td class="p-2">${item["Nama Pemohon"]} (${item["Lokasi / Divisi"]})</td>
            <td class="p-2">${item["Deskripsi Pekerjaan"]}</td>
            <td class="p-2">
              <input type="text" id="tek-${item.ID}" value="${item.Teknisi}" class="border p-1 rounded text-sm w-28">
            </td>
            <td class="p-2">
              <select id="stat-${item.ID}" class="border p-1 rounded text-sm">
                <option value="Pending" ${item.Status === 'Pending' ? 'selected' : ''}>Pending</option>
                <option value="Proses" ${item.Status === 'Proses' ? 'selected' : ''}>Proses</option>
                <option value="Selesai" ${item.Status === 'Selesai' ? 'selected' : ''}>Selesai</option>
              </select>
            </td>
            <td class="p-2">
              <input type="text" id="cat-${item.ID}" value="${item["Catatan Teknisi"]}" class="border p-1 rounded text-sm w-32">
            </td>
            <td class="p-2">
              <button onclick="saveRow('${item.ID}')" class="bg-blue-600 text-white px-2 py-1 rounded text-xs">Simpan</button>
            </td>
          </tr>
        `;
      });
    }

    function saveRow(id) {
      const teknisi = document.getElementById(`tek-${id}`).value;
      const status = document.getElementById(`stat-${id}`).value;
      const catatan = document.getElementById(`cat-${id}`).value;
      updateOrder(id, teknisi, status, catatan);
    }

    window.onload = loadData;
  </script>
</head>
<body class="bg-gray-100 p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Form Pengguna -->
    <div class="bg-white p-6 rounded shadow">
      <h2 class="text-xl font-bold mb-4 text-gray-800">1. Form Pengajuan Work Order (Pengguna)</h2>
      <form id="formOrder" onsubmit="submitOrder(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <input type="text" id="nama" placeholder="Nama Pemohon" class="border p-2 rounded w-full" required>
          <input type="text" id="lokasi" placeholder="Lokasi / Divisi" class="border p-2 rounded w-full" required>
        </div>
        <textarea id="deskripsi" placeholder="Deskripsi Masalah / Pekerjaan" class="border p-2 rounded w-full" required></textarea>
        <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded">Kirim Permintaan</button>
      </form>
    </div>

    <!-- Dashboard Admin & Teknisi -->
    <div class="bg-white p-6 rounded shadow overflow-x-auto">
      <h2 class="text-xl font-bold mb-4 text-gray-800">2. Dashboard Pengelolaan (Admin & Teknisi)</h2>
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="bg-gray-200 text-sm">
            <th class="p-2">ID</th>
            <th class="p-2">Tanggal</th>
            <th class="p-2">Pemohon</th>
            <th class="p-2">Pekerjaan</th>
            <th class="p-2">Teknisi</th>
            <th class="p-2">Status</th>
            <th class="p-2">Catatan</th>
            <th class="p-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="dataWO" class="text-sm"></tbody>
      </table>
    </div>

  </div>
</body>
</html>
